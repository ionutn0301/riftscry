name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  reading-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify new visitor, directory, log and notebook layouts
        run: pnpm exec playwright test tests/e2e/reading-layout.spec.ts --project=desktop --project=mobile-chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-layout
          path: |
            player-visuals/reading-*
            test-results/
          retention-days: 14

  performance-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enforce production asset budgets
        run: node scripts/performance-budget.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure startup and verify search, motion and rendering cost
        run: pnpm exec playwright test --config=playwright.performance.config.ts
        env:
          CI: "true"
      - name: Verify first search on static development pages
        run: pnpm exec playwright test --config=playwright.player.config.ts appearance.spec.ts ux-review.spec.ts --grep 'appearance themes support|search distinguishes' --output=test-results-development-search
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-experience
          path: |
            performance-results/
            test-results/
            test-results-development-search/
          retention-days: 14

  surface-regressions:
    name: surface-regressions (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify archive, Atlas and narrow WebKit regressions
        run: >
          pnpm exec playwright test
          tests/e2e/companion-home.spec.ts tests/e2e/observatory.spec.ts
          tests/e2e/reading-continuity.spec.ts tests/e2e/responsive-surface-polish.spec.ts
          tests/e2e/single-scroll-contract.spec.ts tests/e2e/briefing-report-composition.spec.ts
          tests/e2e/voyage-layout.spec.ts tests/e2e/voyage.spec.ts tests/e2e/connected-observatory.spec.ts
          --project=${{ matrix.project }}
          --grep 'inspection and explicit keep|reduced motion keeps|a long returning identity|champion search stays|phone chapter controls|populated briefing|chapter (history|return) layout at 390|reading destination|patch stations retain|Explore presents|keyboard scene navigation'
        env:
          CI: "true"
      - name: Retain surface geometry and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-regressions-${{ matrix.project }}
          path: |
            player-visuals/
            test-results/
          retention-days: 7

  home-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify the cinematic world, native history, touch and reduced motion
        run: pnpm exec playwright test tests/e2e/home-flight.spec.ts
        env:
          CI: "true"
      - name: Retain world states and full motion video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-flight
          path: |
            player-visuals/flight-*
            test-results/
          retention-days: 7

  briefing-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify populated briefing on the production build with full motion
        run: pnpm exec playwright test tests/e2e/briefing-report-composition.spec.ts --project=desktop --project=mobile-chromium
        env:
          CI: "true"
      - name: Retain briefing loading, report and dock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-composition
          path: |
            player-visuals/briefing-*
            test-results/
          retention-days: 7

  transition-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify live page crossings with motion enabled
        run: pnpm exec playwright test --config=playwright.player.config.ts transition-composition.spec.ts
        env:
          CI: "true"
      - name: Build static loading and native-link fallbacks
        run: pnpm build
      - name: Verify pending scripts, failed art and no-JavaScript navigation
        run: >
          pnpm exec playwright test --project=desktop --output=test-results/fallback
          tests/e2e/interaction-stability.spec.ts tests/e2e/rift-atlas.spec.ts tests/e2e/companion-home.spec.ts
          --grep 'failed imagery leaves|all five destinations are genuine usable links|native world choices and product destinations work without JavaScript'
        env:
          CI: "true"
      - name: Retain transition videos and sampled paint layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-composition
          path: |
            player-visuals/transition-*
            test-results/
          retention-days: 7

  homepage-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify homepage composition and reported browser regressions
        run: >
          pnpm exec playwright test --config=playwright.player.config.ts
          --grep 'viewport scene|one consistent dock|one homepage|champion preview stays pinned|homepage My game|one shared scene frames|every route family|390px pool:|appearance themes|panel spacing|UX audit|a saved player stays reachable|player lookup stays reachable'
        env:
          CI: "true"
      - name: Retain homepage geometry and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-composition
          path: |
            player-visuals/home-*.png
            player-visuals/champions-*.png
            player-visuals/dock-*.png
            player-visuals/viewport-*
            player-visuals/theme-*
            player-visuals/spacing-*
            player-visuals/ux-*
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and integration tests (includes patch-data validation)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify atlas across generated archive routes
        run: node scripts/verify-atlas.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Managed account browser tests
        run: pnpm exec playwright test --config=playwright.accounts.config.ts
        env:
          CI: "true"

      - name: Player workflow browser tests
        run: pnpm exec playwright test --config=playwright.player.config.ts
        env:
          CI: "true"

      - name: Upload player experience captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience
          path: player-visuals/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain player failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-workflow-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  end-to-end:
    name: end-to-end (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: All production browser journeys
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: "true"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-${{ matrix.project }}
          path: |
            signal-visuals/
            player-visuals/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  transition-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify live page crossings with motion enabled
        run: pnpm exec playwright test --config=playwright.player.config.ts transition-composition.spec.ts
        env:
          CI: "true"
      - name: Build static loading and native-link fallbacks
        run: pnpm build
      - name: Verify pending scripts, failed art and no-JavaScript navigation
        run: >
          pnpm exec playwright test --project=desktop --output=test-results/fallback
          tests/e2e/interaction-stability.spec.ts tests/e2e/rift-atlas.spec.ts tests/e2e/companion-home.spec.ts
          --grep 'failed imagery leaves|all five destinations are genuine usable links|all acts expose exact source evidence'
        env:
          CI: "true"
      - name: Retain transition videos and sampled paint layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-composition
          path: |
            player-visuals/transition-*
            test-results/
          retention-days: 7

  homepage-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify homepage composition and reported browser regressions
        run: >
          pnpm exec playwright test --config=playwright.player.config.ts
          --grep 'one homepage|champion preview stays pinned|homepage My game|one shared scene frames|every route family|390px pool:'
        env:
          CI: "true"
      - name: Retain homepage geometry and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-composition
          path: |
            player-visuals/home-*.png
            player-visuals/champions-*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit and integration tests (includes patch-data validation)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify atlas across generated archive routes
        run: node scripts/verify-atlas.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Player workflow browser tests
        run: pnpm exec playwright test --config=playwright.player.config.ts
        env:
          CI: "true"

      - name: Upload player experience captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience
          path: player-visuals/
          if-no-files-found: ignore
          retention-days: 7

      - name: End-to-end tests
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload signal journey captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-journey
          path: signal-visuals/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
